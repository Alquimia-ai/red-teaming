# The workspace root is virtual: it declares the members and the tooling they share, and is not
# itself a distribution. Nothing here is published, so there is no [project] table -- `uv` reads
# [tool.uv.workspace] and treats this directory as the root of the environment every member shares.
#
# Every tool below is configured once, here, rather than per member. A dozen packages linting by a
# dozen slightly different rules is a dozen ways to disagree about the same code.

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

# Every workspace member, one line each, so a member can depend on another by name.
[tool.uv.sources]
red-teaming-contracts = { workspace = true }
red-teaming-settings = { workspace = true }
red-teaming-secrets = { workspace = true }
red-teaming-store = { workspace = true }
red-teaming-judges = { workspace = true }
red-teaming-knowledge = { workspace = true }
red-teaming-target = { workspace = true }
red-teaming-catalogue = { workspace = true }
red-teaming-probes = { workspace = true }
red-teaming-engine = { workspace = true }
red-teaming-dispatch = { workspace = true }
red-teaming-delivery = { workspace = true }
red-teaming-runner = { workspace = true }
red-teaming-api = { workspace = true }
red-teaming-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-env>=1.1",
    "ruff>=0.8",
    "mypy>=1.13",
    # the provider libraries the judges tests build real clients with
    "langchain-openrouter>=0.1.0",
    "langchain-openai>=0.3",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework's idiom

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Our own surface is checked without escape hatches. Third-party stubs are another matter.
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps"]
asyncio_mode = "auto"
env = ["REDTEAM_STORE_BACKEND=memory"]
markers = [
    "live: hits a real model provider or assistant; needs credentials and costs money",
    "docker: needs a docker daemon",
    "k8s: needs a kubernetes cluster",
]

[tool.coverage.run]
source = ["packages", "apps"]
branch = true
