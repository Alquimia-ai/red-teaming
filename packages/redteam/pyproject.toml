[project]
name = "alquimia-redteam"
version = "0.1.0"
description = "Deployable red-teaming app: probes Alquimia agents as black boxes and emits findings. Knows nothing about the brain."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Alquimia" }]

# NOTE: no pyboltzmann, no vitruvio, no braintools. The app crosses the brain boundary
# only through data artifacts (see redteam.ports), so the deployed image stays light and
# decoupled.
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# RoastMe adversarial search (Profiler/Exploiter). Heavy (torch, sentence-transformers,
# networkx) — installed only when running the `roast` pipeline.
roast = ["gaussia[roastme]>=0.1"]
roast-rl = ["gaussia[roastme-rl]>=0.1"]

[project.scripts]
redteam = "redteam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]
