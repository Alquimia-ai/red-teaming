[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_target"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-target"
version = "0.1.0"
description = "The assistant under test: the Alquimia runtime adapter, the replay adapter, typed failures and the safe-mode gate."
requires-python = ">=3.12,<3.14"
dependencies = [
    "red-teaming-contracts",
    "gaussia>=1.2.0",
    "httpx>=0.28",
]

[tool.uv.sources]
red-teaming-contracts = { workspace = true }
