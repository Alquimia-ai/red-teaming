[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_engine"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-engine"
version = "0.1.0"
description = "Governed conduction of one run: the door to the target, multi-turn delivery, recording, resume, the control artifacts and the attack dataset."
requires-python = ">=3.12,<3.14"
dependencies = [
    "red-teaming-contracts",
    "red-teaming-store",
    "red-teaming-catalogue",
    "red-teaming-target",
    "red-teaming-judges",
    "gaussia>=1.2.0",
    "langchain-core>=0.3",
    "pydantic>=2.9",
]

[tool.uv.sources]
red-teaming-contracts = { workspace = true }
red-teaming-store = { workspace = true }
red-teaming-catalogue = { workspace = true }
red-teaming-target = { workspace = true }
red-teaming-judges = { workspace = true }
