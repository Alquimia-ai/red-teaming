[project]
name = "alquimia-braintools"
version = "0.1.0"
description = "Local tooling to curate the Alquimia red-teaming Boltzmann brain (wraps the vitruvio CLI). Never deployed with the app."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Alquimia" }]

dependencies = [
    "typer>=0.12",
    # Boltzmann Protocol SDK — typed access to block shapes. vitruvio (the brain-runtime
    # CLI this wraps) is installed separately via its official install.sh, not from PyPI.
    "pyboltzmann>=0.1",
]

[project.scripts]
braintools = "braintools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braintools"]
