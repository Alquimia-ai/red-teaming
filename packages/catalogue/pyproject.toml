[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_catalogue"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-catalogue"
version = "0.1.0"
description = "Catalogue bundles: plugins, strategies, the contract and the sidecars; the constructions a strategy names; validation and publishing."
requires-python = ">=3.12,<3.14"
dependencies = [
    "red-teaming-contracts",
    "red-teaming-store",
    "gaussia>=1.2.0",
    "langchain-core>=0.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[tool.uv.sources]
red-teaming-contracts = { workspace = true }
red-teaming-store = { workspace = true }
