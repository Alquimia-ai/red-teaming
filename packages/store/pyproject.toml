[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_store"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-store"
version = "0.1.0"
description = "Append-only object store, the key layout, the codecs and the versioned assets. The only stateful piece."
requires-python = ">=3.12,<3.14"
dependencies = [
    "red-teaming-contracts",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "zstandard>=0.23",
]

[tool.uv.sources]
red-teaming-contracts = { workspace = true }
