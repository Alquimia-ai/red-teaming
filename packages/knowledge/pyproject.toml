[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_knowledge"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-knowledge"
version = "0.1.0"
description = "Boltzmann brain consumption: a read-only knowledge base pulled by digest and discarded. Never writes."
requires-python = ">=3.12,<3.14"
dependencies = [
    "red-teaming-contracts",
    "pyboltzmann[oci]>=0.9.1",
]

[tool.uv.sources]
red-teaming-contracts = { workspace = true }
