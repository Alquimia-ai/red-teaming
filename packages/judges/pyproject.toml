[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_judges"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-judges"
version = "0.1.0"
description = "The models a run declares by role: chat-model providers, the logprob grader, embeddings."
requires-python = ">=3.12,<3.14"
dependencies = [
    "red-teaming-contracts",
    "gaussia>=1.2.0",
    "langchain-core>=0.3",
    "httpx>=0.28",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Concrete chat-model providers. The grader takes a LangChain BaseChatModel; which library builds it
# is the deployment's choice, so no provider is a hard dependency.
openrouter = [
    "langchain-openrouter>=0.1.0",
]
openai-compatible = [
    "langchain-openai>=0.3",
]

[tool.uv.sources]
red-teaming-contracts = { workspace = true }
