[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_settings"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "red-teaming-settings"
version = "0.1.0"
description = "Environment-variable settings for every process. 12-factor, no config files."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-settings>=2.6",
]
