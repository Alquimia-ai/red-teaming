# The keys a run may name by `secret_ref`. Fill in, rename to runner-secrets.enc.yaml, encrypt with
# sops, commit. A key a deployment does not use is left out: a run naming it is refused at the gate.
apiVersion: v1
kind: Secret
metadata:
  name: red-teaming-runner-secrets
  namespace: red-teaming
type: Opaque
stringData:
  # The Alquimia runtime's token, for `connector.secret_ref: TARGET_KEY` against a real assistant.
  TARGET_KEY: ""
  # What every in-cluster vLLM endpoint asks for; the models chart hands the same key to the servers.
  VLLM_API_KEY: ""
  # A hosted router's key, for a run that names `provider: openrouter` for some role.
  OPENROUTER_API_KEY: ""
  # `user:token` for a private brain registry, for a run that declares a knowledge base.
  BRAIN_REGISTRY_CREDENTIALS: ""
