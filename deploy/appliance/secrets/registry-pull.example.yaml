# The credential the cluster pulls the packages with, as ghcr.io reads it: a GitHub token with
# `read:packages`, base64 of `{"auths":{"ghcr.io":{"auth":"<base64 user:token>"}}}`. Generate it
# rather than typing it:
#   kubectl -n red-teaming create secret docker-registry red-teaming-registry \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<token> \
#     --dry-run=client -o yaml > registry-pull.enc.yaml && sops --encrypt --in-place registry-pull.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: red-teaming-registry
  namespace: red-teaming
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""
