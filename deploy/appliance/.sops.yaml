# Every file under secrets/*.enc.yaml is encrypted for the keys below and nothing else. Add an
# operator's age public key here and re-encrypt (`sops updatekeys`) to let them decrypt; remove one
# and re-encrypt to revoke. The private keys never live in this repository, on the appliance they
# live in /root/.config/sops/age/keys.txt.
creation_rules:
  - path_regex: secrets/.*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1REPLACE_WITH_THE_OPERATORS_PUBLIC_KEY
