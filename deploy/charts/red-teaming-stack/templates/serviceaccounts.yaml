# Two identities. The API's creates Jobs and reads their status; a runner's does nothing with the
# cluster at all -- it talks to the store, the assistant and the models -- and exists so its pods
# are not the namespace's default and carry the pull secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-api
    {{- include "red-teaming.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.images.pullSecret }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.runner.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-runner
    {{- include "red-teaming.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.runner.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.images.pullSecret }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
