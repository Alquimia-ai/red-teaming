# Only what the values declare inline. A deployment that keeps its credentials elsewhere -- SOPS,
# an external secrets operator -- leaves these empty and creates Secrets under the same names.
{{- if and .Values.runner.secrets (not (empty .Values.runner.secrets)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.runner.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-runner
    {{- include "red-teaming.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.runner.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if include "red-teaming.hasStoreSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.store.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-store
    {{- include "red-teaming.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.minio.enabled }}
  REDTEAM_S3_ACCESS_KEY: {{ .Values.minio.rootUser | quote }}
  REDTEAM_S3_SECRET_KEY: {{ .Values.minio.rootPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
  {{- else }}
  REDTEAM_S3_ACCESS_KEY: {{ .Values.store.accessKey | quote }}
  REDTEAM_S3_SECRET_KEY: {{ .Values.store.secretKey | quote }}
  {{- end }}
{{- end }}
