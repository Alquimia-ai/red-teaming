{{- if .Values.receiver.enabled }}
# A webhook receiver inside the cluster, for a deployment that wants the local stack's shape: it
# keeps every delivery it acknowledges in its own bucket. Built from `deploy/compose/receiver`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: red-teaming-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-receiver
    {{- include "red-teaming.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: red-teaming-receiver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: red-teaming-receiver
        {{- include "red-teaming.labels" . | nindent 8 }}
    spec:
      {{- with .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: receiver
          image: {{ required "receiver.image is required when the receiver is enabled" .Values.receiver.image | quote }}
          env:
            - name: REDTEAM_S3_ENDPOINT
              value: {{ include "red-teaming.storeEndpoint" . | quote }}
            - name: REDTEAM_RECEIVER_BUCKET
              value: {{ .Values.receiver.bucket | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.store.secretName }}
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: red-teaming-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-receiver
    {{- include "red-teaming.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: red-teaming-receiver
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
