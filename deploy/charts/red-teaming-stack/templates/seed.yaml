{{- if .Values.seed.enabled }}
# The business data a run needs, published through the API once it answers: the bundles and the
# prior under `files/seed`, which mirror `deploy/seed` (a guard holds the two together). Handed to
# the Job as one ConfigMap -- a nested tree flattened into keys, and rebuilt on the way in -- so the
# seed needs no image of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: red-teaming-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-seed
    {{- include "red-teaming.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/seed/**" }}
  {{ $path | trimPrefix "files/seed/" | replace "/" "__" }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: red-teaming-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: red-teaming-seed
    {{- include "red-teaming.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: red-teaming-seed
        {{- include "red-teaming.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: seed
          image: {{ .Values.seed.image | quote }}
          env:
            - name: REDTEAM_API_URL
              value: http://red-teaming-api.{{ .Release.Namespace }}.svc:{{ .Values.api.service.port }}
            - name: REDTEAM_SEED_DIR
              value: /seed
          command: ["/bin/sh", "-c"]
          # The ConfigMap's keys are paths with `/` written as `__`; the tree is rebuilt here.
          args:
            - >-
              set -e; mkdir -p /seed;
              for f in /flat/*; do name=$(basename "$f"); dest="/seed/$(echo "$name" | sed 's#__#/#g')";
              mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"; done;
              python /seed/seed.py
          volumeMounts:
            - name: flat
              mountPath: /flat
              readOnly: true
      volumes:
        - name: flat
          configMap:
            name: red-teaming-seed
{{- end }}
