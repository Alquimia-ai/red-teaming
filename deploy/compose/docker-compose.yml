# The local stack. The topology here is the one that ships, not a simplified stand-in: one HTTP
# service, one backing store, and one ephemeral runner container per run created through the Docker
# socket -- the same semantics as a Kubernetes Job. What runs locally is what deploys.
name: red-teaming

x-store: &store
  REDTEAM_STORE_BACKEND: s3
  REDTEAM_S3_ENDPOINT: http://minio:9000
  REDTEAM_S3_BUCKET: ${REDTEAM_S3_BUCKET:-red-teaming}
  REDTEAM_S3_ACCESS_KEY: ${REDTEAM_S3_ACCESS_KEY:-redteamadmin}
  REDTEAM_S3_SECRET_KEY: ${REDTEAM_S3_SECRET_KEY:-redteamadmin}

services:
  # ---- what holds what happened -----------------------------------------------------------
  minio:
    # Pinned, because the store's append-only guarantee rests on the service honouring
    # `If-None-Match: *` on PutObject, and `latest` is whatever this machine pulled last.
    # `S3ObjectStore.verify()` proves it at startup either way.
    #
    # From quay.io, which is where MinIO publishes: the Docker Hub mirror answers an anonymous pull
    # with `pull access denied`, so a stack that named it could not come up on a clean machine.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports: ["${REDTEAM_MINIO_PORT:-9000}:9000", "${REDTEAM_MINIO_CONSOLE_PORT:-9001}:9001"]
    environment:
      MINIO_ROOT_USER: ${REDTEAM_S3_ACCESS_KEY:-redteamadmin}
      MINIO_ROOT_PASSWORD: ${REDTEAM_S3_SECRET_KEY:-redteamadmin}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-seed:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${REDTEAM_S3_ACCESS_KEY:-redteamadmin} ${REDTEAM_S3_SECRET_KEY:-redteamadmin} &&
      mc mb --ignore-existing local/${REDTEAM_S3_BUCKET:-red-teaming} &&
      mc mb --ignore-existing local/${REDTEAM_RECEIVER_BUCKET:-red-teaming-deliveries} &&
      echo 'buckets ready'
      "

  # ---- the gate ---------------------------------------------------------------------------
  api:
    image: ${REDTEAM_API_IMAGE:-ghcr.io/alquimia-ai/red-teaming-api:latest}
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    depends_on:
      minio-seed: { condition: service_completed_successfully }
    ports: ["${REDTEAM_API_PORT:-8080}:8080"]
    # The image runs as its own user and the cluster deployment keeps it that way. Here the API has
    # to open the daemon's socket, which the host mounts as root's, so this one service runs as
    # root -- the price of the docker backend, paid only by the local stack.
    user: root
    environment:
      <<: *store
      # The API launches one runner per run through the Docker socket. Same lifecycle as a Job.
      REDTEAM_DISPATCH_BACKEND: docker
      REDTEAM_RUNNER_IMAGE: ${REDTEAM_RUNNER_IMAGE:-ghcr.io/alquimia-ai/red-teaming-runner:latest}
      # The runner joins this project's network, so it reaches minio and the target by name.
      REDTEAM_DOCKER_NETWORK: ${REDTEAM_DOCKER_NETWORK:-red-teaming_default}
      REDTEAM_SECRETS_BACKEND: env
      # Every credential a run may declare by reference, because the API is what resolves them
      # before it freezes a spec and hands exactly those values to the runner it launches. A
      # reference it cannot resolve is a 400. The mock target checks nothing, so any value
      # satisfies TARGET_KEY; the model keys are absent by default, and a run naming one is refused
      # at the gate until it is set.
      TARGET_KEY: ${TARGET_KEY:-mock-target-checks-nothing}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ALQUIMIA_API_TOKEN: ${ALQUIMIA_API_TOKEN:-}
      # `user:token` for a private brain registry; the setting names the reference, never the
      # value, and it is set only when a grounded run will need one: set both, or neither.
      REDTEAM_BRAIN_REGISTRY_SECRET_REF: ${REDTEAM_BRAIN_REGISTRY_SECRET_REF:-}
      BRAIN_REGISTRY_CREDENTIALS: ${BRAIN_REGISTRY_CREDENTIALS:-}
      REDTEAM_BRAIN_REGISTRY_INSECURE: ${REDTEAM_BRAIN_REGISTRY_INSECURE:-false}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    healthcheck:
      # urllib is in the slim Python base; curl is not.
      test:
        ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---- the business data, published once into an empty store -------------------------------
  # A bare Python rather than a fourth image: the script speaks HTTP through the standard library.
  # Publishing the same bundle again writes nothing, so a stack brought up twice seeds once.
  seed:
    image: python:3.12-slim
    depends_on:
      api: { condition: service_healthy }
    volumes: ["../seed:/seed:ro"]
    environment:
      REDTEAM_API_URL: http://api:8080
    entrypoint: ["python", "/seed/seed.py"]

  # ---- the target, and the consumer that receives the notification ------------------------
  mock-target:
    build: { context: ./mock-target }
    ports: ["${REDTEAM_TARGET_PORT:-8082}:8080"]

  receiver:
    build: { context: ./receiver }
    depends_on:
      minio-seed: { condition: service_completed_successfully }
    environment:
      <<: *store
      REDTEAM_RECEIVER_BUCKET: ${REDTEAM_RECEIVER_BUCKET:-red-teaming-deliveries}
    ports: ["${REDTEAM_RECEIVER_PORT:-8083}:8080"]

# NOT a service: the runner. Created and removed per run through the Docker socket, from the image
# `REDTEAM_RUNNER_IMAGE` names. `redteam local up --build` builds it from this checkout as
# `red-teaming-runner:local`; without `--build`, the published image is pulled.

volumes:
  minio_data:
