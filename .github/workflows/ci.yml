name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the vocabulary guard reads `git ls-files`
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        # `packages/` and `apps/` fill in as the workspace grows; the guards are typed from day one.
        run: uv run mypy tests $([ -d packages ] && echo packages) $([ -d apps ] && echo apps)
      - name: Tests
        # Everything but the tiers that need credentials, a docker daemon or a cluster.
        run: uv run pytest -q -m "not live and not docker and not k8s"
      - name: Dockerfiles
        # Rendered from the workspace closure; a hand edit is a drift the guard also refuses.
        run: uv run python scripts/render_dockerfiles.py --check
      - name: Shell
        # `install.sh` is piped into whatever `sh` is on somebody's machine, so it is checked like
        # code. shellcheck is preinstalled on the runner.
        run: shellcheck install.sh scripts/build_pyz.sh deploy/appliance/install.sh

  charts:
    # The charts render on every change, with the appliance's and each cloud's values, and what
    # they render is checked against what the dispatcher and the seed expect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: Lint
        run: |
          helm lint deploy/charts/red-teaming-stack
          helm lint deploy/charts/red-teaming-models -f deploy/catalog/models/qwen3-8b.yaml
      - name: Render
        run: |
          for values in deploy/appliance/values-appliance.yaml deploy/cloud/values-eks.yaml deploy/cloud/values-gke.yaml; do
            helm template red-teaming deploy/charts/red-teaming-stack --namespace red-teaming -f "$values" > /dev/null
          done
          helm template red-teaming-models deploy/charts/red-teaming-models --namespace red-teaming \
            -f deploy/catalog/models/qwen3-8b.yaml -f deploy/catalog/models/qwen3-embedding-0.6b.yaml \
            -f deploy/catalog/hardware/l40s-48g.yaml > /dev/null
      - name: Guards over the rendered charts
        run: uv run pytest -q tests/guards/test_charts.py

  cli:
    # One platform on a pull request, the whole matrix on develop (`cli-develop.yml`) and on a
    # release: the same workflow each time, so a release is never the first time anybody builds it.
    uses: ./.github/workflows/build-cli.yml
    with:
      runners: '["ubuntu-latest"]'
    permissions:
      contents: read
