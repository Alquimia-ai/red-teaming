name: Publish an image

# One app's image, built from the repository root with the Dockerfile the workspace closure
# rendered, pushed to this repository's packages on ghcr.io under every tag it is given. Reused by
# the develop and the release workflows, so the two cannot drift on how an image is built.
on:
  workflow_call:
    inputs:
      app:
        description: "api or runner: which apps/<app>/Dockerfile"
        required: true
        type: string
      tags:
        description: "space-separated tags; a tag starting with `sha-` is shortened to 7 characters"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Name the image and its tags
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/red-teaming-${{ inputs.app }}"
          tags=""
          for tag in ${{ inputs.tags }}; do
            case "$tag" in sha-*) tag="sha-$(echo "${tag#sha-}" | cut -c1-7)";; esac
            tags="${tags}${image}:${tag}"$'\n'
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,scope=${{ inputs.app }},mode=max
